# Kheperax deceptive maze as a fully observed RL task: lasers, bumpers, the robot's position and the
# time left. Reward: 10 x the decrease in distance to the target, plus 50 on reaching it. Driving the
# routes with a scripted controller (discount 0.99): parking at the dead end under the target is worth
# 5.0, solving the maze (119 steps, first moving away from the target) 18.1. Kheperax's own reward
# (minus the distance every step) makes parking optimal (-24.7 against -45.4), so it is not used.
ENV_NAME: Kheperax-standard
ENV_KWARGS: {position: true, reward: progress}
TIME_OBS: true
HIDDEN: [128, 128]
TOTAL_STEPS: 5_000_000
NUM_ENVS: 8
GAMMA: 0.99
LR: 5.0e-4
SHARE_INTERVAL: 16
LOG_INTERVAL: 50_000
SUCCESS_METRIC: goal
# single-learner tuning (sweep tune_kheperax_pos, held-out seeds): every setting parks at the dead end
# (about 1% of agents ever reach the goal); best final return: DQN with these settings
LR: 2.5e-4
EPS_FRACTION: 0.1
EPS_END: 0.05
